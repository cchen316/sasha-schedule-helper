<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sasha Schedule Helper</title>
  <style>
    body{
      margin:0;
      font-family:Arial,sans-serif;
      background:#faf7f3;
      color:#222;
    }
    .hero{
      max-width:900px;
      margin:80px auto;
      text-align:center;
      padding:40px;
    }
    h1{
      font-size:48px;
      margin-bottom:16px;
    }
    p{
      font-size:20px;
      color:#666;
      line-height:1.6;
    }
    .btn{
      display:inline-block;
      margin-top:32px;
      padding:14px 28px;
      background:#c96f45;
      color:white;
      text-decoration:none;
      border-radius:10px;
      font-size:18px;
    }
  </style>
</head>
<body>
  <div class="hero">
    <h1>Sasha Schedule Helper</h1>
    <p>
      Helping Sasha stay organized, avoid scheduling conflicts,
      and make time-off requests easier.
    </p>
    <a class="btn" href="#setup">Connect Google</a>
  </div>
  <div id="setup" style="max-width:900px;margin:40px auto 100px;padding:40px;background:white;border-radius:16px;box-shadow:0 2px 20px rgba(0,0,0,0.06);">
  <h2>Setup</h2>

  <p>Employee Name</p>
  <input style="width:100%;padding:12px;margin-bottom:20px;" placeholder="Chen">

  <p>Manager Email Pattern</p>
  <input style="width:100%;padding:12px;margin-bottom:20px;" placeholder="dominos">

  <p>Review Email</p>
  <input style="width:100%;padding:12px;margin-bottom:20px;" placeholder="chen.chen.316@gmail.com">

  <p>PTO Recipient Email</p>
  <input style="width:100%;padding:12px;margin-bottom:20px;" placeholder="manager@example.com">

  <p>Work Schedule Calendar ID</p>
  <input style="width:100%;padding:12px;margin-bottom:20px;" placeholder="calendar id">

  <p>Appointment Calendar ID</p>
  <input style="width:100%;padding:12px;margin-bottom:20px;" placeholder="calendar id">

  <a class="btn" href="#">Save Settings</a>
</div>
<script>
const saved = localStorage.getItem('sashaSettings');

if (saved) {
  const data = JSON.parse(saved);
  const inputs = document.querySelectorAll('#setup input');

  inputs[0].value = data.employeeName || '';
  inputs[1].value = data.managerEmailPattern || '';
  inputs[2].value = data.reviewEmail || '';
  inputs[3].value = data.ptoRecipientEmail || '';
  inputs[4].value = data.workCalendarId || '';
  inputs[5].value = data.appointmentCalendarId || '';
}
document.querySelector('#setup .btn').addEventListener('click', function(e){
  e.preventDefault();

  const inputs = document.querySelectorAll('#setup input');

  const settings = {
    employeeName: inputs[0].value,
    managerEmailPattern: inputs[1].value,
    reviewEmail: inputs[2].value,
    ptoRecipientEmail: inputs[3].value,
    workCalendarId: inputs[4].value,
    appointmentCalendarId: inputs[5].value
  };

  localStorage.setItem(
    'sashaSettings',
    JSON.stringify(settings)
  );

  alert('Settings saved successfully.');
});
</script>
</body>
</html>
